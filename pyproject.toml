[project]
name = "piphi-modbus-rtu-sidecar"
version = "0.1.0"
description = "Piphi Modbus Rtu Sidecar PiPhi sidecar runtime."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "piphi-runtime-kit-python>=0.7.1,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
]


[project.scripts]
piphi_modbus_rtu_sidecar = "piphi_modbus_rtu_sidecar.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piphi_modbus_rtu_sidecar"]
